# The binary release. It runs the advisory check, builds `starmap` for macOS,
# Linux and Windows, checks that each binary prints the release's version,
# and attaches the archives to the GitHub release of the tag with SHA256SUMS.
# It creates the release when the tag has none.
#
# release.yml calls it with the tag that release-plz pushed, because GitHub
# starts no workflow for a tag that a job's own token pushes. A tag pushed by
# hand, such as the first release's v0.1.0, starts it directly. A manual run
# with a tag releases that existing tag. A manual run without a tag, and a
# pull request that changes this file, build the archives and release
# nothing. The tag is `v<version>`, where <version> is the workspace version
# in Cargo.toml.
#
# Turning on immutable releases breaks the upload into a release that
# release-plz created. If publish ever pushes its tag with the App token
# instead of github.token, the tag push and the call from release.yml both
# start this workflow, and the two runs race.
#
# No job uses rust-cache, because a poisoned cache would reach the released
# binaries, and zizmor fails a release workflow that restores a cache.
name: Binaries

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [.github/workflows/binaries.yml]
  workflow_call:
    inputs:
      tag:
        description: The tag that release-plz pushed.
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to release, such as v0.1.0. Leave it empty to build without releasing.
        type: string
        default: ""

# Each job grants only the permissions it needs.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tag to release, if any, and the version that Cargo.toml holds at it.
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # actions/checkout reads the repository.
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      # A call from release.yml runs on the push to main, so its tag comes
      # from the input.
      - id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            tag=$INPUT_TAG
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=$GITHUB_REF_NAME
          else
            tag=
          fi
          case "$tag" in
            "" | v[0-9]*) ;;
            *) echo "the tag is $tag, and a release tag starts with v and a digit" >&2; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}
          persist-credentials: false
      - run: rustup toolchain install
      - id: version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          version=$(cargo pkgid --package starmap-cli | sed 's/.*[#@]//')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$TAG" ] && [ "$TAG" != "v$version" ]; then
            echo "the tag is $TAG and Cargo.toml says $version" >&2
            exit 1
          fi

  # BASE-29: a release waits for the advisory check, so it ships no
  # dependency with a known security advisory.
  advisories:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # actions/checkout reads the repository.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - name: advisories
        run: cargo deny --locked check advisories

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          # crt-static links the C runtime in, so the binary needs no VC++
          # redistributable.
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            rustflags: -C target-feature=+crt-static
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read # actions/checkout reads the repository.
    # Git Bash runs the steps on Windows too.
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.version.outputs.version }}
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false
      # rustup installs the toolchain that rust-toolchain.toml pins.
      - run: rustup target add "$TARGET"
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-auditable@0.7.7
          fallback: none
      # BASE-30: the binary records the dependency versions it contains.
      - run: cargo auditable build --release --locked --package starmap-cli --target "$TARGET"
      # A Windows binary prints CRLF line endings, so the check drops the CR.
      - name: version
        run: |
          printed=$("target/$TARGET/release/starmap" --version | tr -d '\r')
          if [ "$printed" != "starmap $VERSION" ]; then
            echo "the binary printed '$printed', and the release is $VERSION" >&2
            exit 1
          fi
      - run: |
          name=starmap-$VERSION-$TARGET
          mkdir -p "dist" "$name"
          cp LICENSE-MIT LICENSE-APACHE README.md "$name/"
          case "$TARGET" in
            *-windows-*)
              cp "target/$TARGET/release/starmap.exe" "$name/"
              7z a "dist/$name.zip" "$name" ;;
            *)
              cp "target/$TARGET/release/starmap" "$name/"
              tar -czf "dist/$name.tar.gz" "$name" ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: starmap-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # The release gets the archives and SHA256SUMS. release-plz has created the
  # release of a tag that it pushed, so the files go to that release. A run
  # again after a failure replaces the files that the failed run uploaded.
  release:
    if: needs.version.outputs.tag != ''
    needs: [version, advisories, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # gh creates the release and uploads its files.
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: starmap-*
          path: dist
          merge-multiple: true
      - run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes dist/*
          fi
