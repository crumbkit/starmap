# The scheduled lane, which the map's `lanes` decision records (BASE-25).
# The advisories job runs daily and checks for new advisories against the
# locked dependencies (BASE-29). The properties job runs weekly and runs every
# property test with 10,000 cases, where the pull-request lane runs
# proptest's default of 256. A manual run starts both jobs. The report job
# keeps every failure on one issue. Nothing waits for this lane.
name: Scheduled

on:
  schedule:
    # Each job's `if` names the cron expression it runs on, so a change here
    # changes the job's condition too.
    - cron: "43 6 * * *" # Daily at 06:43 UTC, for advisories.
    - cron: "17 7 * * 1" # Mondays at 07:17 UTC, for properties.
  workflow_dispatch:

# Each job grants only the permissions it needs.
permissions: {}

env:
  # Any compiler or Clippy warning fails the build (BASE-1).
  CARGO_BUILD_WARNINGS: deny
  CARGO_TERM_COLOR: always

jobs:
  advisories:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '43 6 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # actions/checkout reads the repository.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - name: advisories
        run: cargo deny --locked check advisories

  # The job has no rust-cache, because rust-cache keys include the job ID,
  # so its cache would not help the pull-request lane.
  properties:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 7 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # actions/checkout reads the repository.
    env:
      # A variable set in the job wins over the [env] table of
      # .cargo/config.toml. Each run uses a new seed, its run id, so the
      # weekly runs try different cases, and the run id reproduces a failure.
      PROPTEST_CASES: 10000
      PROPTEST_RNG_SEED: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest@0.9.140
          fallback: none
      - name: properties
        run: cargo nextest run --locked --workspace --all-features

  # When a job of this lane fails, this job comments on the open issue titled
  # "Scheduled CI failed", or opens that issue when none is open, so failures
  # collect in one place. Each scheduled run starts one of the two jobs and
  # skips the other, and a skipped job does not make failure() true. It uses
  # the gh CLI that the ubuntu-slim image includes.
  report:
    needs: [advisories, properties]
    if: failure()
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      issues: write # gh comments on the issue or opens it.
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: Scheduled CI failed
        run: |
          number=$(gh issue list --state open --search "in:title $TITLE" --json number,title \
            --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "This scheduled run failed: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "This scheduled run failed: $RUN_URL"
          fi
