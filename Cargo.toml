[workspace]
resolver = "3"
members = [
    "crates/starmap",
    "crates/starmap-derive",
    "crates/starmap-test",
    "crates/starmap-resolve",
    "crates/starmap-cli",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/crumbkit/starmap"

[workspace.dependencies]
# clap parses xtask's subcommands. The workspace entry enables only `std`.
# Cargo turns on a feature for every crate in a build when any one crate asks
# for it, so each crate enables only the features its own code needs.
clap = { version = "4.6.7", default-features = false, features = ["std"] }

# url parses the value of a variable whose type is "url" by the WHATWG URL
# Standard, which browsers and most HTTP clients follow. Its default `std`
# feature adds only file-path conversions and socket address lookup, which
# starmap does not use.
url = { version = "2.5.8", default-features = false }

# toml_edit parses starmap.toml with the span of every key and value, and
# writes the canonical form that `Spec::to_toml` returns.
toml_edit = "0.25.17"

# sha2 computes the SHA-256 digest of a spec's canonical form, which
# `Spec::digest` returns. Its default features add boxed hashers (`alloc`)
# and an object identifier (`oid`), which starmap does not use.
sha2 = { version = "0.11.1", default-features = false }

# secrecy holds each withheld value in a box that zeroes its memory on drop
# and whose Debug never prints the value (BASE-24). It has no default
# features, and its optional `serde` feature stays off, so a secret cannot
# be serialized.
secrecy = "0.10.3"

# zeroize names the trait that bounds `starmap::Secret<T>`: a type whose
# memory a drop can zero. Its default `alloc` feature implements it for
# `String`, the type a withheld value is read as.
zeroize = "1.9.1"

# proptest checks the checking constructors and the forms against generated
# inputs, and the lanes decision sets its case counts. Only tests use it.
proptest = { version = "1.12.0", default-features = false }

# snapbox compares each spec problem's rendered text and span with its golden
# file, and rewrites the golden files when SNAPSHOTS=overwrite is set, as
# crumbkit's golden files are compared. Only tests use it, and none of its
# features is needed.
snapbox = { version = "1.2.2", default-features = false }

# starmap re-exports the derives of starmap-derive behind its `derive`
# feature, starmap-test checks a derived struct against a spec, and
# starmap-resolve resolves a spec's variables into the `Bindings` that
# starmap checks. Each entry gives a version beside the path, because
# cargo-deny treats a path dependency without a version as a wildcard, and
# the release pull request moves both versions with the workspace version.
starmap = { version = "0.0.0", path = "crates/starmap" }
starmap-derive = { version = "0.0.0", path = "crates/starmap-derive" }

# syn, quote and proc-macro2 build starmap-derive, the `Env` and
# `Enumeration` derives behind starmap's `derive` feature. The entries enable
# no feature, and starmap-derive enables the ones it uses.
syn = { version = "3.0.6", default-features = false }
quote = { version = "1.0.47", default-features = false }
proc-macro2 = { version = "1.0.107", default-features = false }

# trybuild compiles the derive's misuses and compares each compile error with
# its golden `.stderr` file. Only tests use it.
trybuild = "1.0.122"

# crumbkit holds the command-line conventions of the `starmap` command
# (the cli profile of the Rust standards): `parse` and `finish`, documents,
# failures with codes and next steps, and the help guide. The workspace entry
# enables no feature, and starmap-cli enables the ones it uses.
crumbkit = { version = "0.1.0", default-features = false }

# crumbkit-usage keeps the `starmap` command's local usage log and adds
# `self usage` (CLI-7).
crumbkit-usage = "0.1.0"

# crumbkit-test checks the `starmap` command against crumbkit's conventions
# (CLI-6). Only tests use it.
crumbkit-test = "0.1.0"

# miette describes a spec problem as a diagnostic whose labels point into
# starmap.toml, which crumbkit's `miette` feature prints with an excerpt of
# the file. The CLI implements `Diagnostic` by hand and needs no miette
# feature.
miette = { version = "7.6.0", default-features = false }

# serde and schemars describe the documents that the `starmap` command
# prints, as crumbkit's results require. The workspace entries enable no
# feature, and starmap-cli enables `derive`.
serde = { version = "1.0.229", default-features = false }
schemars = { version = "1.2.2", default-features = false }

# serde_json reads the JSON documents that the CLI's tests compare. Only
# tests use it.
serde_json = { version = "1.0.151", default-features = false }

# tempfile gives each CLI test that writes a file its own directory, which
# it removes when the test ends. Only tests use it.
tempfile = { version = "3.27.0", default-features = false }

# The lint table is lints/base.toml and lints/library.toml of the Rust
# standards (BASE-1, LIB-2, LIB-3). A build with CARGO_BUILD_WARNINGS=deny
# fails on any warning, and every package inherits the table through
# `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"                 # BASE-3
unreachable_pub = "warn"               # BASE-8
missing_debug_implementations = "warn"
missing_docs = "deny"                  # LIB-2

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny" # LIB-2

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
allow_attributes = "deny"                # BASE-2
allow_attributes_without_reason = "deny" # BASE-2
unwrap_used = "deny"                     # BASE-4
expect_used = "deny"                     # BASE-4
panic = "deny"                           # BASE-4
todo = "deny"                            # BASE-4
unimplemented = "deny"                   # BASE-4
dbg_macro = "deny"                       # BASE-4
unreachable = "deny"                     # BASE-4
indexing_slicing = "deny"                # BASE-4
cast_possible_truncation = "deny"        # BASE-12
cast_sign_loss = "deny"                  # BASE-12
cast_possible_wrap = "deny"              # BASE-12
cast_precision_loss = "deny"             # BASE-12
cast_lossless = "deny"                   # BASE-12
disallowed_methods = "deny"              # BASE-5, BASE-6, BASE-7, BASE-11
disallowed_types = "deny"                # BASE-5
disallowed_macros = "deny"               # BASE-7
print_stdout = "deny"                    # BASE-5
print_stderr = "deny"                    # BASE-5
mod_module_files = "deny"                # BASE-9
too_many_lines = "deny"                  # BASE-10
wildcard_imports = "deny"                # BASE-13
enum_glob_use = "deny"                   # BASE-13
ref_option = "deny"                      # BASE-14
needless_for_each = "deny"               # BASE-15
fn_params_excessive_bools = "deny"       # BASE-16
missing_errors_doc = "deny"              # LIB-2
missing_panics_doc = "deny"              # LIB-2
must_use_candidate = "deny"              # LIB-3

# Arithmetic overflow panics in release builds too (BASE-27). The map's
# release-profile decision records why the other settings keep Cargo's
# defaults.
[profile.release]
overflow-checks = true
