[variables.SHELF_PORT]
purpose = "The port the catalogue listens on."
type = "port"
unset = { default = "8080" }
show = "shown"
source = "setting"

[families.SHELF_DB_URL]
purpose = "The database of one region, keyed by its code."
type = "url"
unset = "optional"
show = "shown"
source = "setting"

[variables.LIBRARY_URL]
purpose = "The address of the library service."
type = "url"
unset = "required"
show = "shown"
source = "setting"
