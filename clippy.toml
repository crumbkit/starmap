# The union of the clippy.toml fragments of the base, cli and child-process
# profiles of the Rust standards. Each effect belongs to one owning module,
# which suppresses the lint with #[expect] and a reason (BASE-5). An entry
# whose owning module exists names its path in the reason, and the others
# state the rule until the pull request that adds their owning module.

allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true
allow-indexing-slicing-in-tests = true
too-many-lines-threshold = 150 # BASE-10
max-fn-params-bools = 3 # BASE-16

disallowed-methods = [
    # BASE-6, LIB-1: an application reads its environment once, in main,
    # through the derived Env::load(), and the starmap libraries read none.
    { path = "std::env::var", reason = "only crates/starmap-cli/src/main.rs reads the environment, and the libraries read none" },
    { path = "std::env::var_os", reason = "only crates/starmap-cli/src/main.rs reads the environment, and the libraries read none" },
    { path = "std::env::vars", reason = "only crates/starmap-cli/src/main.rs reads the environment, and the libraries read none" },
    { path = "std::env::vars_os", reason = "only crates/starmap-cli/src/main.rs reads the environment, and the libraries read none" },
    { path = "std::env::set_var", reason = "build a snapshot in the test instead" },
    { path = "std::env::remove_var", reason = "build a snapshot in the test instead" },
    { path = "std::env::current_dir", reason = "read the directory from the snapshot" },
    { path = "std::env::set_current_dir", reason = "pass the directory to the operation instead" },
    # BASE-24: a secret's text is read only in the files that the BASE-24
    # binding of rust-standards.toml lists.
    { path = "secrecy::ExposeSecret::expose_secret", reason = "read a secret through starmap::Secret::expose", allow-invalid = true },
    { path = "starmap::Secret::expose", reason = "expose a secret only in a file that the BASE-24 binding lists", allow-invalid = true },
    # BASE-7
    { path = "std::process::exit", reason = "return the exit code from main so destructors run" },
    # BASE-11
    { path = "std::thread::sleep", reason = "wait for an observable signal, or sleep in the clock owner" },
    { path = "tokio::time::sleep", reason = "wait for an observable signal, or sleep in the clock owner", allow-invalid = true },
    # CLI-1
    { path = "std::io::stdout", reason = "print through crumbkit::finish in crates/starmap-cli/src/lib.rs" },
    { path = "std::io::stderr", reason = "print through crumbkit::finish in crates/starmap-cli/src/lib.rs" },
    { path = "std::io::stdin", reason = "read through crumbkit's Output in crates/starmap-cli/src/lib.rs, which knows whether input is a terminal" },
    # PROC-1
    { path = "std::process::Command::new", reason = "start processes in crates/starmap-resolve/src/process.rs, which runs op read, or crates/starmap-cli/src/git.rs, which runs git" },
    { path = "std::process::Command::spawn", reason = "start processes in crates/starmap-resolve/src/process.rs, which runs op read, or crates/starmap-cli/src/git.rs, which runs git" },
    { path = "std::process::Command::status", reason = "start processes in crates/starmap-resolve/src/process.rs, which runs op read, or crates/starmap-cli/src/git.rs, which runs git" },
    { path = "std::process::Command::output", reason = "start processes in crates/starmap-resolve/src/process.rs, which runs op read, or crates/starmap-cli/src/git.rs, which runs git" },
    { path = "std::os::unix::process::CommandExt::exec", reason = "replacing this process bypasses the process module" },
    { path = "tokio::process::Command::new", reason = "start processes in crates/starmap-resolve/src/process.rs, which runs op read, or crates/starmap-cli/src/git.rs, which runs git", allow-invalid = true },
    { path = "tokio::process::Command::spawn", reason = "start processes in crates/starmap-resolve/src/process.rs, which runs op read, or crates/starmap-cli/src/git.rs, which runs git", allow-invalid = true },
    { path = "tokio::process::Command::status", reason = "start processes in crates/starmap-resolve/src/process.rs, which runs op read, or crates/starmap-cli/src/git.rs, which runs git", allow-invalid = true },
    { path = "tokio::process::Command::output", reason = "start processes in crates/starmap-resolve/src/process.rs, which runs op read, or crates/starmap-cli/src/git.rs, which runs git", allow-invalid = true },
]

disallowed-types = [
    # PROC-1
    { path = "std::process::Child", reason = "let crates/starmap-resolve/src/process.rs or crates/starmap-cli/src/git.rs hold the child, which owns its deadline and cleanup" },
]

# BASE-7: the untyped-error macros of the project's error crates. starmap
# depends on no error crate yet.
disallowed-macros = []
