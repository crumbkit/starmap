# A generated value asks for more than 1024 bytes, a generated bytes type
# asks for fewer than 16, and another sets bytes beside its bytes type.
[variables.SHELF_SESSION_KEY]
purpose = "Signs the cookies of the web view."
type = "string"
unset = "required"
show = "withheld"
source = "generated"
bytes = 4096

[variables.SHELF_COOKIE_KEY]
purpose = "Signs the cookies of the reader."
type = { bytes = { encoding = "hex", length = 8 } }
unset = "required"
show = "withheld"
source = "generated"

[variables.SHELF_CSRF_KEY]
purpose = "Signs the forms of the web view."
type = { bytes = { encoding = "base64", length = 32 } }
unset = "required"
show = "withheld"
source = "generated"
bytes = 32
