[package]
name = "starmap"
description = "Declares the environment variables an application reads, checks values against the declaration and applies them to a child process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["environment", "configuration", "env", "variables"]
categories = ["config"]
include = ["src/**/*.rs", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]

[dependencies]
# The `derive` feature re-exports `#[derive(Env)]` and
# `#[derive(Enumeration)]`.
starmap-derive = { workspace = true, optional = true }
secrecy.workspace = true
sha2.workspace = true
toml_edit.workspace = true
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
# `std` builds proptest on the standard library and gives the strategies that
# generate strings from a regular expression. The default features add
# forking, timeouts and bit-set strategies, which the tests do not use.
proptest = { workspace = true, features = ["std"] }
snapbox.workspace = true
trybuild.workspace = true

[features]
# `derive` is off by default (LIB-6), so a host that only checks and
# resolves a spec builds no syn. An application turns it on to derive `Env`
# and `Enumeration`, which it re-exports beside the traits of the same names.
derive = ["dep:starmap-derive"]

[lints]
workspace = true

# trybuild compiles each file under tests/compile_fail as a crate of its own,
# so no target links them, and cargo-shear would report them as unlinked.
[package.metadata.cargo-shear]
ignored-paths = ["tests/compile_fail/*.rs"]
