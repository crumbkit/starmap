# src builds the name of a member of SHELF_DB_URL, which this file
# declares, of SHELF_CACHE_URL, which it does not, and a name that the scan
# cannot resolve.
[families.SHELF_DB_URL]
purpose = "The database of one region, keyed by the region's code."
type = "url"
unset = "optional"
show = "shown"
source = "setting"

[variables.SHELF_PORT]
purpose = "The port the api process listens on."
type = "port"
unset = "required"
show = "shown"
source = "setting"
