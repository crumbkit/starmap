[package]
name = "starmap-resolve"
description = "Resolves the values of an application's declared environment variables for the program that starts it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["environment", "configuration", "secrets"]
categories = ["config"]
include = ["src/**/*.rs", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]

[dependencies]
# Resolution reads a starmap `Spec` and returns the `Bindings` that
# `starmap::check` checks.
starmap.workspace = true
# zeroize zeroes the bytes that `op read` and `op inject` printed when they
# do not become a secret, such as output that is not UTF-8, for the
# `one-password` feature.
# For the `keychain` feature, it zeroes the random bytes of a generated value
# once they are written as text, and the bytes a Keychain item held when they
# are not UTF-8.
zeroize = { workspace = true, optional = true }
# getrandom gives the random bytes of the markers that split the output of
# one `op inject` into a value for each reference, for the `one-password`
# feature. It reads the operating system's random source and adds no
# generator of its own.
getrandom = { version = "0.4.3", default-features = false, optional = true }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
# nix reads the current user's uid and the uid of the process behind the
# agent's socket (getpeereid on macOS, SO_PEERCRED on Linux) without unsafe
# code, for the `agent` feature. `user` gives the uid calls and `socket`
# the socket option.
nix = { version = "0.31.3", default-features = false, features = ["user", "socket"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# landlock asks the running kernel whether its Landlock can deny a
# sandboxed app the agent's socket. Without that right the `agent` feature
# leaves the agent off.
landlock = { version = "0.4.7", optional = true }

[dev-dependencies]
# `std` gives the strategies that generate strings from a regular
# expression, which the expand property uses.
proptest = { workspace = true, features = ["std"] }
# tempfile gives each agent test a private directory short enough for a
# socket path.
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# security-framework is the maintained binding of Apple's Security
# framework, which reads, adds and deletes Keychain items and gives
# cryptographically secure random bytes. Only the `keychain` feature uses
# it, and only on macOS. Its default features add TLS options that starmap
# does not use.
security-framework = { version = "3.7.0", default-features = false, optional = true }
# libc declares `confstr` and `_CS_DARWIN_USER_TEMP_DIR`, which the `agent`
# feature calls to find the person's own temporary directory.
libc = { version = "0.2.191", optional = true }
# core-foundation builds the `CFData` that holds a new item's value, which
# security-framework's add call takes. security-framework already depends
# on it.
core-foundation = { version = "0.10.1", optional = true }
# base64 writes a generated value's random bytes as base64url text. Its
# `alloc` feature encodes into a `String`.
base64 = { version = "0.23.1", default-features = false, features = ["alloc"], optional = true }

# No feature is on by default (LIB-6).
[features]
# one-password reads secrets through the 1Password CLI's `op inject` and
# `op read`.
one-password = ["dep:zeroize", "dep:getrandom"]
# agent reads 1Password values from the per-user agent's cache and puts the
# ones it reads with `op` back. It builds on macOS and Linux.
agent = ["one-password", "dep:nix", "dep:libc", "dep:landlock"]
# keychain creates, reads and forgets generated secrets in the macOS Keychain.
keychain = ["dep:security-framework", "dep:core-foundation", "dep:base64", "dep:zeroize"]

[lints]
workspace = true
