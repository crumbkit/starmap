[package]
name = "starmap-test"
description = "Tests that an application's starmap declaration matches the environment variables its code reads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["environment", "configuration", "testing"]
categories = ["config", "development-tools::testing"]
include = ["src/**/*.rs", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]

[dependencies]
# The check parses the spec and compares it with the fields of a struct
# that implements `starmap::Env`.
starmap.workspace = true

[dev-dependencies]
# The tests derive `Env` and `Enumeration` for the structs they check.
starmap = { workspace = true, features = ["derive"] }
# url is the type of a URL field in the tests' structs.
url.workspace = true
# snapbox compares each disagreement report with its golden file, and
# rewrites the golden files when SNAPSHOTS=overwrite is set.
snapbox.workspace = true

[lints]
workspace = true
